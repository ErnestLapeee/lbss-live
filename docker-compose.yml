services:
  postgres:
    image: postgres:16-alpine
    container_name: lbss-postgres
    environment:
      POSTGRES_USER: lbss
      POSTGRES_PASSWORD: lbss_dev_password
      POSTGRES_DB: lbss
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
